        Promise.all([
            d3.json("assist_network_all_teams.json").catch(() => null),
            d3.json("shot_heatmap_all_teams.json").catch(() => null),
            d3.json("assist_network.json").catch(() => null),
            d3.json("shot_heatmap.json").catch(() => null)
        ]).then(([assistAll, shotAll, assistSingle, shotSingle]) => {
            if (assistAll && assistAll.data && assistAll.teams) {
                teamMeta = assistAll.teams;
                teamMeta.forEach(t => {
                    const teamData = assistAll.data[t.abbreviation] || { nodes: [], links: [] };
                    const nodes = (teamData.nodes || []).map(node => ({
                        ...node,
                        id: normalizeName(node.id),
                        team: node.team || t.abbreviation,
                        position: node.position || "Unknown"
                    }));
                    const nodeIds = new Set(nodes.map(n => n.id));
                    const links = (teamData.links || [])
                        .map(link => ({
                            source: normalizeName(link.source),
                            target: normalizeName(link.target),
                            value: Number(link.value) || 0
                        }))
                        .filter(link => nodeIds.has(link.source) && nodeIds.has(link.target));
                    allAssistByTeam[t.abbreviation] = { nodes, links };
                });
            } else if (assistSingle && Array.isArray(assistSingle.nodes) && Array.isArray(assistSingle.links)) {
                const fallbackTeam = "DAL";
                const nodes = assistSingle.nodes.map(node => ({
                    ...node,
                    id: normalizeName(node.id),
                    team: node.team || fallbackTeam,
                    position: node.position || "Unknown"
                }));
                const nodeIds = new Set(nodes.map(n => n.id));
                const links = assistSingle.links
                    .map(link => ({
                        source: normalizeName(link.source),
                        target: normalizeName(link.target),
                        value: Number(link.value) || 0
                    }))
                    .filter(link => nodeIds.has(link.source) && nodeIds.has(link.target));
                allAssistByTeam[fallbackTeam] = { nodes, links };
                teamMeta = [{ abbreviation: fallbackTeam, full_name: "Dallas Mavericks" }];
            } else {
                throw new Error("No assist dataset available.");
            }

            if (shotAll && shotAll.data) {
                teamMeta.forEach(t => {
                    const shotData = shotAll.data[t.abbreviation];
                    // Handle both old format (array) and new format (object with team/by_player)
                    if (Array.isArray(shotData)) {
                        allShotsByTeam[t.abbreviation] = { team: shotData, by_player: {} };
                    } else if (shotData && typeof shotData === 'object') {
                        allShotsByTeam[t.abbreviation] = shotData;
                    } else {
                        allShotsByTeam[t.abbreviation] = { team: [], by_player: {} };
                    }
                });
            } else if (Array.isArray(shotSingle)) {
                const fallbackTeam = teamMeta[0].abbreviation;
                allShotsByTeam[fallbackTeam] = { team: shotSingle, by_player: {} };
            }

            fillSelect(
                teamSelect,
                teamMeta
                    .slice()
                    .sort((a, b) => a.full_name.localeCompare(b.full_name))
                    .map(t => ({ value: t.abbreviation, label: t.full_name })),
                "DAL"
            );

            // Initialize highlight player options
            updateHighlightPlayerOptions();

            applyBtn.addEventListener("click", renderAll);

            // Update highlight options when team changes
            teamSelect.addEventListener("change", () => {
                updateHighlightPlayerOptions();
            });

            // Live update for min assists slider
            minAssistsSlider.addEventListener("input", () => {
                minAssistsVal.textContent = minAssistsSlider.value;
            });

            sectionTabs.forEach(button => {
                button.addEventListener("click", () => setActiveSectionTab(button.dataset.tab));
            });
            
            shotPlayerSelect.addEventListener("change", (e) => {
                currentShotPlayer = e.target.value;
                renderShotDensity();
            });

            vizToggleBtns.forEach(btn => {
                btn.addEventListener("click", () => setActiveViz(btn.dataset.viz));
            });
            
            window.addEventListener("resize", () => {
                renderNetwork(currentGraph);
                if (activeViz === "chord") {
                    renderChordDiagram();
                }
                if (activeSectionTab === "assists") {
                    renderMatrix(currentGraph);
                    renderAssistInsights(currentGraph);
                    renderTopContributors(currentGraph);
                } else if (activeSectionTab === "shots") {
                    renderShotDensity();
                }
            });

            renderAll();
        }).catch(error => {
            console.error("Could not load assist network:", error);
            document.querySelector(".page").innerHTML = `
                <div class="panel" style="padding: 24px; text-align: center;">
                    <h2 style="margin-top: 0;">Data Load Error</h2>
                    <p>Could not load team datasets. Run the Python data build, then refresh.</p>
                    <p style="margin-bottom: 0; color: #5c6f91;">Run: <code>py -m http.server 8000</code></p>
                </div>
            `;
        });
    </script>
</body>
</html>
